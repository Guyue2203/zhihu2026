<script>
const DICT={
zh:{brand:'此一时，彼一时',brandMark:'转',slogan:'探索流动中的答案',lead1:'答案是有语境的，此一时，彼一时：在不同的时空中，语境不同，答案自然会不同。',lead2:'在这里，我们想让你看到随时间流动的答案。',placeholder:'输入一个问题，看看它的答案怎么变…',examplesHeading:'想了解点什么？',hotLabel:'知乎热搜',hotClickHint:'点击填入输入框，按回车开始检索',stageLabels:{default:'默认阶段',fewer:'更少阶段',more:'更多阶段'},tagStageTitle:'选择生成结果包含的阶段数量',tagZhihu:'知乎检索',tagZhihuTitleOn:'开启时用知乎官方接口检索真实帖子；点击关闭后改用模型自身知识整理',tagZhihuTitleOff:'已关闭知乎检索：点击可重新开启，用知乎官方接口检索真实帖子',optionDefault:'默认',optionDefaultNote:'约 3 个阶段，模型按问题调整',optionFewer:'更少',optionFewerNote:'适当减少阶段数量',optionMore:'更多',optionMoreNote:'适当增加阶段数量',themeToDark:'切换深色模式',themeToLight:'切换浅色模式',waitKey:'寻找答案改变的时刻',waitStart:'正在把问题放回时间中…',waitElapsed:n=>`已进行 ${n} 秒，正在核对不同阶段的讨论。`,noQuestion:'知乎问题',noAnswerer:'知乎用户',noViewpoint:'暂无观点简介',viewOriginal:'查看原帖 ↗',changeLabel:'判断如何改变',evidenceLabel:'改变判断的证据',relatedLabel:'相关知乎讨论',unknownPeriod:'时间不明',unknownCognition:'阶段认知',unknownChange:'变化不明',unknownEvidence:'证据不足',prevStage:'← 上一阶段',nextStage:'下一阶段 →',backToStart:'回到开头',backToAsk:'← 提出新问题',coverageSampled:'有限检索结果',coverageModel:'模型知识整理 · 未启用知乎检索',aboutResult:'关于本次结果',resultCounts:(a,b)=>`共检索 ${a} 条材料，展示 ${b} 条。`,errorTitle:'这次没有顺利生成',errorRetry:'返回重新提问',errorFallback:'请稍后再试。',stageTabLabel:n=>`阶段 ${n}`},
en:{brand:'Ciyishi, Biyishi',brandMark:'CI',slogan:'Answers in Motion',lead1:'Every answer has a context: this time, that time. Across different moments and situations, the context changes, so the answer changes with it.',lead2:'Here we want to show you answers as they move through time.',placeholder:'Ask a question and see how its answer changes…',examplesHeading:'What would you like to understand?',hotLabel:'Zhihu trending',hotClickHint:'Click to fill the input, then press Enter',stageLabels:{default:'Default stages',fewer:'Fewer stages',more:'More stages'},tagStageTitle:'Choose how many stages to generate',tagZhihu:'Zhihu search',tagZhihuTitleOn:'On: real posts are retrieved through the official Zhihu API. Turn off to summarize from model knowledge instead.',tagZhihuTitleOff:'Zhihu retrieval is off: click to turn it back on and retrieve real posts through the official API.',optionDefault:'Default',optionDefaultNote:'About 3 stages, adjusted by the model',optionFewer:'Fewer',optionFewerNote:'Reduce the number of stages',optionMore:'More',optionMoreNote:'Add stages when a real turn exists',themeToDark:'Switch to dark mode',themeToLight:'Switch to light mode',waitKey:'Finding the moment the answer changed',waitStart:'Putting the question back into time…',waitElapsed:n=>`${n}s elapsed — checking discussions from different stages.`,noQuestion:'Zhihu question',noAnswerer:'Zhihu user',noViewpoint:'No summary available',viewOriginal:'View original ↗',changeLabel:'How the judgment changed',evidenceLabel:'Evidence that changed it',relatedLabel:'Related Zhihu discussions',unknownPeriod:'Time unknown',unknownCognition:'Stage cognition',unknownChange:'Change unclear',unknownEvidence:'Insufficient evidence',prevStage:'← Previous stage',nextStage:'Next stage →',backToStart:'Back to start',backToAsk:'← Ask a new question',coverageSampled:'Sampled retrieval',coverageModel:'Model knowledge · Zhihu retrieval off',aboutResult:'About this result',resultCounts:(a,b)=>`${a} sources retrieved, ${b} shown.`,errorTitle:'Generation did not complete',errorRetry:'Ask another question',errorFallback:'Please try again later.',stageTabLabel:n=>`Stage ${n}`}
};
let lang=localStorage.getItem('lang')==='en'?'en':'zh';
const t=key=>{const value=DICT[lang][key];return value===undefined?DICT.zh[key]:value};
const pick=(zh,en)=>lang==='zh'?zh:en;
function applyLang(next){
  lang=next;document.documentElement.lang=lang==='zh'?'zh-CN':'en';
  try{localStorage.setItem('lang',lang)}catch{}
  document.querySelectorAll('[data-i18n]').forEach(node=>{const key=node.dataset.i18n;const value=t(key);if(typeof value==='string')node.textContent=value});
  document.querySelectorAll('[data-i18n-placeholder]').forEach(node=>{const value=t(node.dataset.i18nPlaceholder);if(typeof value==='string')node.placeholder=value});
  document.querySelectorAll('[data-i18n-title]').forEach(node=>{const value=t(node.dataset.i18nTitle);if(typeof value==='string')node.title=value});
  document.querySelectorAll('.seg.langs button').forEach(button=>{const on=button.dataset.lang===lang;button.classList.toggle('active',on);button.setAttribute('aria-pressed',String(on))});
  const stageLabel=t('stageLabels')[stagePreference];if(stageLabel)document.querySelector('#stage-tag-label').textContent=stageLabel;
  const zhihuOn=retrieval==='zhihu';zhihuTag.title=t(zhihuOn?'tagZhihuTitleOn':'tagZhihuTitleOff');
  document.querySelector('#theme-toggle').title=t(themeIsDark()?'themeToLight':'themeToDark');
  document.querySelectorAll('[data-i18n-dynamic]').forEach(node=>{const make=node['i18n'+node.dataset.i18nDynamic];if(typeof make==='function')node.textContent=make()});
  renderExamples();
}
function switchLang(next){applyLang(next);if(currentJourney)render(currentJourney)}
function themeIsDark(){return document.documentElement.dataset.theme==='dark'}
function systemDark(){return matchMedia('(prefers-color-scheme: dark)').matches}
function readSavedTheme(){try{return localStorage.getItem('theme')}catch{return null}}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!readSavedTheme())applyTheme(systemDark()?'dark':'light')});
function applyTheme(mode,{save=false}={}){
  if(mode==='dark')document.documentElement.dataset.theme='dark';else delete document.documentElement.dataset.theme;
  if(save){try{localStorage.setItem('theme',mode)}catch{}}
  const dark=themeIsDark();const toggle=document.querySelector('#theme-toggle');
  toggle.title=t(dark?'themeToLight':'themeToDark');toggle.setAttribute('aria-label',toggle.title);
  document.querySelector('#icon-moon').classList.toggle('icon-hidden',dark);document.querySelector('#icon-sun').classList.toggle('icon-hidden',!dark);
  const meta=document.querySelector('meta[name="theme-color"]');if(meta)meta.content=dark?'#0b0d12':'#fafafa';
}
const HOT_SLOTS=3;let hotItems=[],hotIndex=0,hotTimer=0,hotSwapTimer=0;
function stopHot(){if(hotTimer)clearInterval(hotTimer);hotTimer=0;if(hotSwapTimer)clearTimeout(hotSwapTimer);hotSwapTimer=0}
function renderHot(){
  stopHot();
  const row=document.querySelector('#hot-row');const list=document.querySelector('.hot-list');
  const slots=[...document.querySelectorAll('.hot-ticker')];
  if(!row||!list||!slots.length)return;
  if(!hotItems.length){row.hidden=true;return}
  slots.forEach((slot,offset)=>{
    const index=(hotIndex+offset)%hotItems.length;const item=hotItems[index];
    slot.dataset.index=String(index);
    slot.textContent=item.title;slot.title=t('hotClickHint')+'\\n'+item.title;
  });
  row.hidden=false;
  requestAnimationFrame(()=>{row.classList.add('ready');list.classList.remove('swap')});
  if(reducedMotion()||hotItems.length<=HOT_SLOTS)return;
  hotTimer=setInterval(()=>{
    if(document.hidden||!document.body.contains(row))return;
    list.classList.add('swap');
    hotSwapTimer=setTimeout(()=>{
      if(!document.body.contains(row))return;
      hotIndex=(hotIndex+1)%hotItems.length;
      renderHot();
    },300);
  },5200);
}
function reducedMotion(){return matchMedia('(prefers-reduced-motion: reduce)').matches}
async function loadHot(){
  const row=document.querySelector('#hot-row');
  const slots=[...document.querySelectorAll('.hot-ticker')];
  if(!row||!slots.length)return;
  try{
    const response=await fetch('/api/v1/hot');
    if(!response.ok)throw new Error('hot');
    const data=await response.json();
    hotItems=Array.isArray(data.items)?data.items.filter(item=>item&&item.title):[];
    if(!hotItems.length){row.hidden=true;return}
    hotIndex=0;renderHot();
    slots.forEach(slot=>slot.addEventListener('click',()=>{
      const item=hotItems[Number(slot.dataset.index)||0];if(!item)return;
      input.value=item.title;shell.classList.add('has-value');input.focus();
    }));
    row.addEventListener('pointerenter',stopHot);
    row.addEventListener('pointerleave',()=>{if(!reducedMotion())renderHot()});
  }catch{ if(row)row.hidden=true }
}
const EXAMPLES=[{zh:'共享单车为什么失败？',en:'Why did bike-sharing fail?'},{zh:'百度为什么会显得没有活力？',en:'Why does Baidu look like it has lost momentum?'},{zh:'元宇宙怎么样了？',en:'Whatever happened to the metaverse?'}];
function renderExamples(){
  const box=document.querySelector('#examples');if(!box)return;box.replaceChildren();
  EXAMPLES.forEach(item=>{
    const button=document.createElement('button');button.type='button';button.className='example';
    button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
    button.append(document.createTextNode(item[lang]));
    button.addEventListener('click',()=>{input.value=item[lang];shell.classList.add('has-value');input.focus()});
    box.append(button);
  });
}
document.querySelectorAll('.seg.langs button').forEach(button=>button.addEventListener('click',()=>switchLang(button.dataset.lang)));
document.querySelector('#theme-toggle').addEventListener('click',()=>applyTheme(themeIsDark()?'light':'dark',{save:true}));
const form=document.querySelector('#search');
const input=document.querySelector('#query');
const shell=document.querySelector('.search-shell');
const home=document.querySelector('#home');
const result=document.querySelector('#result');
input.addEventListener('input',()=>shell.classList.toggle('has-value',input.value.trim().length>0));
let stagePreference='default';
const stageTag=document.querySelector('#stage-tag');
const stageMenu=document.querySelector('#stage-menu');
const stageLabels=t('stageLabels');
function setStagePreference(value){
  stagePreference=value;
  document.querySelector('#stage-tag-label').textContent=stageLabels[value];
  stageTag.dataset.pref=value;
  document.querySelectorAll('.stage-option').forEach(option=>{const selected=option.dataset.pref===value;option.classList.toggle('selected',selected);option.setAttribute('aria-checked',String(selected))});
}
function toggleStageMenu(open){
  const next=open??stageMenu.hidden;
  stageMenu.hidden=!next;
  stageTag.setAttribute('aria-expanded',String(next));
}
stageTag.addEventListener('click',()=>toggleStageMenu());
document.querySelectorAll('.stage-option').forEach(option=>option.addEventListener('click',()=>{setStagePreference(option.dataset.pref);toggleStageMenu(false)}));
document.addEventListener('click',event=>{if(!stageMenu.hidden&&!stageMenu.contains(event.target)&&!stageTag.contains(event.target))toggleStageMenu(false)});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!stageMenu.hidden)toggleStageMenu(false)});
setStagePreference('default');
let retrieval='zhihu';
const zhihuTag=document.querySelector('#zhihu-tag');
zhihuTag.addEventListener('click',()=>{
  retrieval=retrieval==='zhihu'?'model':'zhihu';
  const on=retrieval==='zhihu';
  zhihuTag.classList.toggle('active',on);
  zhihuTag.setAttribute('aria-pressed',String(on));
  zhihuTag.title=t(on?'tagZhihuTitleOn':'tagZhihuTitleOff');
});
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const el=(tag,text='',className='')=>{const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;return node};
let currentJourney=null;
let currentStage=0;

function sourceItem(post,index){const row=el('article','', 'source');row.append(el('span',String(index+1).padStart(2,'0'),'source-index'));const copy=el('div');copy.append(el('h4',post.question||t('noQuestion')),el('p',post.viewpoint||post.excerpt||t('noViewpoint')),el('small',`${post.answerer||t('noAnswerer')} · ${post.votes||0} ${pick('赞同','upvotes')} · ${post.comments||0} ${pick('评论','comments')}`));row.append(copy);if(post.url&&post.url!=='#'){const link=el('a',t('viewOriginal'));link.href=post.url;link.target='_blank';link.rel='noopener noreferrer';row.append(link)}return row}

function showStage(index){
  if(!currentJourney)return;
  currentStage=Math.min(Math.max(index,0),currentJourney.stages.length-1);
  const stage=currentJourney.stages[currentStage];
  const posts=new Map((currentJourney.posts||[]).map(post=>[post.id,post]));
  document.querySelectorAll('.stage-tab').forEach((button,i)=>{button.classList.toggle('active',i===currentStage);button.setAttribute('aria-current',i===currentStage?'step':'false')});
  const previous=document.querySelector('.stage-card');if(previous)previous.remove();
  const card=el('section','', 'stage-card');
  card.append(el('div',stage.period||t('unknownPeriod'),'stage-period'),el('h3',stage.cognition||t('unknownCognition')));
  const insights=el('div','', 'insight-grid');const change=el('div','', 'insight');change.append(el('strong',t('changeLabel')),el('p',stage.change||t('unknownChange')));const evidence=el('div','', 'insight');evidence.append(el('strong',t('evidenceLabel')),el('p',stage.evidence||t('unknownEvidence')));insights.append(change,evidence);card.append(insights);
  const selected=(stage.postIds||[]).map(id=>posts.get(id)).filter(Boolean);if(selected.length){const list=el('section','', 'source-list');list.append(el('strong',t('relatedLabel')));selected.forEach((post,i)=>list.append(sourceItem(post,i)));card.append(list)}
  const actions=el('div','', 'stage-actions');const prev=el('button',t('prevStage'));prev.disabled=currentStage===0;prev.addEventListener('click',()=>showStage(currentStage-1));const next=el('button',currentStage===currentJourney.stages.length-1?t('backToStart'):t('nextStage'),'primary');next.addEventListener('click',()=>showStage(currentStage===currentJourney.stages.length-1?0:currentStage+1));actions.append(prev,next);card.append(actions);
  const details=document.querySelector('.details');result.insertBefore(card,details);card.scrollIntoView({behavior:'smooth',block:'center'});
}

function render(data){
  currentJourney=data;currentStage=0;result.replaceChildren();
  const top=el('div','', 'result-top');const back=el('button',t('backToAsk'),'back-button');back.addEventListener('click',reset);top.append(back,el('span',data.coverage==='model'?t('coverageModel'):t('coverageSampled'),'coverage'));result.append(top);
  const heading=el('header','', 'result-heading');heading.append(el('h2',data.title||data.query),el('p',data.thesis||''));result.append(heading);
  const tabs=el('nav','', 'stage-tabs');tabs.setAttribute('aria-label',pick('认知阶段','Stages'));(data.stages||[]).forEach((stage,index)=>{const button=el('button',stage.period||t('stageTabLabel')(index+1),'stage-tab');button.addEventListener('click',()=>showStage(index));tabs.append(button)});result.append(tabs);
  const details=document.createElement('details');details.className='details';const summary=document.createElement('summary');summary.textContent=t('aboutResult');const body=el('div','', 'details-body');for(const item of data.limitations||[])body.append(el('div',`· ${item}`));body.append(el('div',t('resultCounts')(data.evidenceCount||0,data.selectedCount||0)));details.append(summary,body);result.append(details);
  result.hidden=false;showStage(0);scrollTo({top:0,behavior:'smooth'});
}

function reset(){currentJourney=null;result.hidden=true;result.replaceChildren();home.hidden=false;input.value='';shell.classList.remove('has-value');input.focus();scrollTo({top:0,behavior:'smooth'})}

function showError(message){result.replaceChildren();const box=el('div','', 'error');box.append(el('strong',t('errorTitle')),el('p',message||t('errorFallback')));const back=el('button',t('errorRetry'),'back-button');back.addEventListener('click',reset);box.append(back);result.append(box);result.hidden=false}

async function submit(event){
  event.preventDefault();const query=input.value.trim();if(query.length<2)return;toggleStageMenu(false);const button=form.querySelector('.submit');button.disabled=true;home.hidden=true;result.hidden=false;const waiting=el('section','', 'wait');const inner=el('div','', 'wait-inner');const progress=el('p','正在把问题放回时间中…');const waitKey=el('strong',t('waitKey'));const waitStart=el('p',t('waitStart'));waitStart.hidden=true;waitKey['i18nDynamic']=()=>t('waitKey');waitStart['i18nDynamic']=()=>t('waitStart');progress.dataset.i18nDynamic='Elapsed';progress['i18nElapsed']=()=>elapsedText();inner.append(el('div','','wait-mark'),waitKey,waitStart,progress);waiting.append(inner);result.replaceChildren(waiting);let settled=false;let preludeShown=false;const startedAt=Date.now();const elapsedText=()=>t('waitElapsed')(Math.round((Date.now()-startedAt)/1000));const timer=setInterval(()=>{progress.textContent=preludeShown?progress.textContent:elapsedText()},3000);
  try{const preludeFetch=fetch('/api/v1/prelude',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,stagePreference,retrieval})}).then(async response=>response.ok?await response.json():null).catch(()=>null);preludeFetch.then(data=>{if(!settled&&data?.prelude){preludeShown=true;progress.textContent=data.prelude}});const request=fetch('/api/v1/journey',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query,stagePreference,retrieval})}).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'生成失败');return data});const [data]=await Promise.all([request,wait(700)]);settled=true;render(data)}catch(error){settled=true;showError(error.message)}finally{clearInterval(timer);button.disabled=false}
}

applyTheme(readSavedTheme()||(systemDark()?'dark':'light'));
applyLang(lang);
loadHot();
form.addEventListener('submit',submit);
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});

(function(){
  const canvas=document.querySelector('#bg');if(!canvas)return;
  const ctx=canvas.getContext('2d');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scheme=()=>document.documentElement.dataset.theme==='dark'?{colors:[[64,136,255],[104,166,255],[142,190,255]],alpha:.2,glow:[70,140,255]}:{colors:[[0,102,255],[61,139,255],[127,179,255]],alpha:1,glow:[0,102,255]};
  let palette=scheme();const mouse={x:-1e4,y:-1e4,active:false};
  new MutationObserver(()=>{palette=scheme()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  let w=0,h=0,particles=[],raf=0,last=0,resizeTimer=0,burst=false,burstAt=0,visits=0;
  function textTargets(octx){
    const size=Math.min(w*.34,h*.5);
    octx.font=`900 ${size}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif`;
    octx.textAlign='center';octx.textBaseline='middle';octx.fillStyle='#000';octx.fillText('知乎',w/2,h*.47);
  }
  async function sampleTargets(octx){
    let fromLogo=false;
    try{
      const response=await fetch('/zhihu-logo.png');if(!response.ok)throw new Error('logo');
      const bitmap=await createImageBitmap(await response.blob());
      const logoW=Math.min(w*.78,h*1.9);const logoH=logoW*bitmap.height/bitmap.width;
      octx.drawImage(bitmap,w/2-logoW/2,h*.46-logoH*.34,logoW,logoH);fromLogo=true;
    }catch{ textTargets(octx) }
    const data=octx.getImageData(0,0,w,h).data;const step=Math.max(5,Math.round(Math.min(w,h)/150));const points=[];
    for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){const i=(y*w+x)*4;const r=data[i],b=data[i+2],a=data[i+3];if(fromLogo?(a>120&&b>r+40):a>140)points.push(x,y)}
    return points;
  }
  async function build(){
    w=canvas.clientWidth;h=canvas.clientHeight;
    const dpr=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    const off=document.createElement('canvas');off.width=w;off.height=h;const octx=off.getContext('2d');
    const points=await sampleTargets(octx);const stride=Math.max(1,Math.ceil(points.length/2/3200));particles=[];
    for(let i=0;i<points.length;i+=stride*2){const hx=points[i],hy=points[i+1];
      // 开场：粒子从整屏随机位置与随机速度出发，再由弹簧收拢成"知乎"字形
      particles.push({hx:hx+(Math.random()-.5)*3,hy:hy+(Math.random()-.5)*3,x:reduced?hx:Math.random()*w,y:reduced?hy:Math.random()*h,vx:reduced?0:(Math.random()-.5)*1.5,vy:reduced?0:(Math.random()-.5)*1.5,s:2+Math.round(Math.random()*2),a:(.3+Math.random()*.42)*palette.alpha,c:palette.colors[(i>>1)%3]});}
    burstAt=performance.now();burst=!reduced;visits=0;
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const burstNow=burst;visits++;
    if(burstNow){
      let settled=0;
      for(const p of particles){if(Math.hypot(p.hx-p.x,p.hy-p.y)<3)settled++;}
      if(settled/particles.length>.97||performance.now()-burstAt>3200)burst=false;
    }
    if(mouse.active&&!burstNow){const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,240);g.addColorStop(0,`rgba(${palette.glow[0]},${palette.glow[1]},${palette.glow[2]},.12)`);g.addColorStop(1,`rgba(${palette.glow[0]},${palette.glow[1]},${palette.glow[2]},0)`);ctx.fillStyle=g;ctx.fillRect(mouse.x-240,mouse.y-240,480,480)}
    for(const p of particles){
      
      p.vx+=(p.hx-p.x)*.12+(Math.random()-.5)*.09;p.vy+=(p.hy-p.y)*.12+(Math.random()-.5)*.09;
      let near=0;
      if(mouse.active&&!burstNow){const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);
        if(d<130){const k=1-d/130;near=k;const a=Math.random()*Math.PI*2;
          p.vx+=Math.cos(a)*1.8*k+dx/(d||1)*.6*k;p.vy+=Math.sin(a)*1.8*k+dy/(d||1)*.6*k}}
      p.vx*=.75;p.vy*=.75;p.x+=p.vx;p.y+=p.vy;
      const s=p.s;ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${Math.min(1,p.a+near*.6)})`;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
    }
  }
  const frame=t=>{raf=requestAnimationFrame(frame);if(document.hidden)return;if(t-last<1000/30)return;last=t-(t-last)%(1000/30);draw()};
  if(!reduced&&!matchMedia('(hover: none)').matches){
    addEventListener('pointermove',event=>{mouse.x=event.clientX;mouse.y=event.clientY;mouse.active=true},{passive:true});
    document.addEventListener('mouseleave',()=>{mouse.active=false});addEventListener('blur',()=>{mouse.active=false});
  }
  addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{build().then(()=>{if(reduced)draw()})},160)},{passive:true});
  build().then(()=>{if(reduced)draw();else raf=requestAnimationFrame(frame)});
})();
</script>
</body>
