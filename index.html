const HOT_SLOTS=3;let hotItems=[],hotIndex=0,hotTimer=0,hotSwapTimer=0;

function renderHot(){
  stopHot();

  if(!row||!list||!slots.length)return;

  slots.forEach((slot,offset)=>{
    const index=(hotIndex+offset)%hotItems.length;const item=hotItems[index];
    const title=lang==='en'&&item.titleEn?item.titleEn:item.title;
    slot.dataset.index=String(index);
    (slot.firstElementChild||slot).textContent=title;
    slot.title=[t('hotClickHint'),title,title===item.title?'':item.title].filter(Boolean).join('\n');
  });
  row.hidden=false;
  requestAnimationFrame(()=>{row.classList.add('ready');list.classList.remove('swap')});
  if(reducedMotion()||hotItems.length<=HOT_SLOTS)return;
  hotTimer=setInterval(()=>{
    if(document.hidden||!document.body.contains(row))return;
    list.classList.add('swap');
    hotSwapTimer=setTimeout(()=>{

async function loadHot(){

  try{
    const response=await fetch('/api/v1/hot');
    if(!response.ok)throw new Error('hot');
    const data=await response.json();
    hotItems=Array.isArray(data.items)?data.items.filter(item=>item&&item.title):[];
    if(!hotItems.length){row.hidden=true;return}
    hotIndex=0;renderHot();
    slots.forEach(slot=>slot.addEventListener('click',()=>{
      const item=hotItems[Number(slot.dataset.index)||0];if(!item)return;
      input.value=item.title;shell.classList.add('has-value');input.focus();// 检索语料是中文，英文界面下也填入中文原标题
    }));
    row.addEventListener('pointerenter',stopHot);
    row.addEventListener('pointerleave',()=>{if(!reducedMotion())renderHot()});
  }catch{ if(row)row.hidden=true }
}

function compactText(value,maxLength=64){

}

function compactPeriod(value){

/* 知乎登录：浏览器只持有应用自己的会话标识，OAuth token 始终留在服务端 */

function showToast(text){const node=document.querySelector('#toast');if(!node)return;node.textContent=text;node.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{node.hidden=true},9000)}
function showView(view){mePage.hidden=view!=='me';home.hidden=view!=='home';result.hidden=view!=='result';document.body.classList.toggle('result-mode',view==='result')}

  login.hidden=Boolean(user)||!me?.oauthConfigured;login.disabled=!me?.oauthConfigured;

async function loadMe(){

async function logout(){
  try{await fetch('/api/v1/auth/logout',{method:'POST'})}catch{}

/* ------------------------------------------------------------ 用户界面与分页 */
function openProfile(){
  if(!me?.user){showToast(t('needLogin'));return}
  if(location.hash==='#/me')renderMePage();else location.hash='#/me';
}
function route(){
  if(location.hash==='#/me'){
    if(!me?.user){history.replaceState(null,'',location.pathname);if(meLoaded)showToast(t('needLogin'));return}
    showView('me');renderMePage();return;
  }
  if(!mePage.hidden)showView(currentJourney?'result':'home');
}
function renderMePage(){
  const user=me?.user;if(!user||mePage.hidden)return;
  const profile=document.querySelector('#me-profile');profile.replaceChildren();
  const media=document.createElement('div');
  if(user.avatarPath){const image=document.createElement('img');image.className='me-avatar';image.src=user.avatarPath;image.alt='';media.append(image)}
  else media.append(el('div',(user.fullname||'知').slice(0,1),'me-avatar-fallback'));
  const info=document.createElement('div');
  info.append(el('h2',user.fullname||t('anonymousUser'),'me-name'));
  if(user.headline)info.append(el('p',user.headline,'me-headline'));
  info.append(el('p',`${t('uidLabel')} · ${user.uid}`,'me-meta'));
  const actions=el('div','','me-actions');
  const logoutButton=el('button',t('logoutAction'));logoutButton.addEventListener('click',logout);
  actions.append(logoutButton);
  profile.append(media,info,actions);
  const tabs=document.querySelector('#me-tabs');tabs.replaceChildren();
  for(const [key,label] of [['followees',t('tabFollowees')],['contents',t('tabContents')],['history',t('myHistory')]]){
    const button=el('button',label,'me-tab');button.setAttribute('role','tab');
    const active=meState.tab===key;button.classList.toggle('active',active);button.setAttribute('aria-selected',String(active));
    button.addEventListener('click',()=>selectMeTab(key));
    tabs.append(button);
  }
  renderMePanel();
  const state=meState[meState.tab];
  if(!state.loaded&&!state.loading)loadMeTab(meState.tab,{append:false});

function selectMeTab(key){if(meState.tab===key)return;meState.tab=key;renderMePage()}
function meEmptyText(){return meState.tab==='followees'?t('followeesEmpty'):meState.tab==='contents'?t('contentsEmpty'):t('historyEmpty')}
function renderMePanel(){
  const panel=document.querySelector('#me-panel');if(!panel)return;
  const state=meState[meState.tab];const nodes=[];
  const totals=state.paging?.totals;
  if(state.loaded&&state.items.length&&Number.isFinite(totals))nodes.push(el('div',meState.tab==='followees'?t('totalPeople')(totals):t('totalItems')(totals),'me-end'));
  for(const item of state.items)nodes.push(meState.tab==='followees'?renderFollowee(item):meState.tab==='contents'?renderContent(item):renderHistory(item));
  if(state.error)nodes.push(el('div',state.error,'me-message error'));
  else if(state.loading)nodes.push(el('div',t('meLoading'),'me-message'));
  else if(!state.items.length)nodes.push(el('div',meEmptyText(),'me-message'));
  else nodes.push(mePagingControl(state));
  panel.replaceChildren(...nodes);
}
function mePagingControl(state){
  if(meState.tab==='history'){
    // 历史接口没有 Paging，按「返回满一页就可能还有」处理
    return state.items.length<20?el('div',t('loadMoreEnd'),'me-end'):meMoreButton('history');
  }
  const paging=state.paging;
  if(!paging)return el('div','','me-end');
  if(paging.incomplete)return el('div',t('pagingIncomplete'),'me-message');
  if(paging.isEnd||!paging.nextOffset)return el('div',t('loadMoreEnd'),'me-end');
  return meMoreButton(meState.tab);
}
function meMoreButton(kind){const button=el('button',t('loadMore'),'load-more');button.addEventListener('click',()=>loadMeTab(kind,{append:true}));return button}
function renderFollowee(item){
  const card=el('div','','me-person');const media=document.createElement('div');
  if(item.avatarUrl){const image=document.createElement('img');image.src=item.avatarUrl;image.alt='';image.loading='lazy';media.append(image)}
  else media.append(el('div',(item.fullname||'知').slice(0,1),'me-person-fallback'));
  const body=document.createElement('div');const name=el('strong');
  if(item.url){const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=item.fullname||t('anonymousUser');name.append(link)}
  else name.textContent=item.fullname||t('anonymousUser');

  if(item.headline)body.append(el('span',item.headline));
  card.append(media,body,el('em',t('followersLabel')(item.followerCount)));

}
function renderContent(item){
  const card=el('div','','me-card');const heading=el('h3');
  const label=item.title||t('contentTypes')[item.contentType]||item.contentType||'—';
  if(item.url){const link=document.createElement('a');link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent=label;heading.append(link)}
  else heading.textContent=label;

function renderHistory(item){
  const card=el('div','','me-card');
  card.append(el('h3',item.title||item.query),el('div',`${item.query} · ${item.createdAtIso.slice(0,10)}`,'me-card-foot'));

  rerun.addEventListener('click',()=>{
    input.value=item.query;shell.classList.add('has-value');
    if(item.preference&&DICT.zh.stageLabels[item.preference])stagePreference=item.preference;
    retrieval=item.source==='model'?'model':'zhihu';
    applyLang(lang);location.hash='';form.requestSubmit();
  });

async function responseError(response){const data=await response.json().catch(()=>({}));return data.error||`HTTP ${response.status}`}
async function loadMeTab(kind,{append=false}={}){
  const state=meState[kind];if(state.loading)return;
  state.loading=true;state.error='';
  if(!append){state.items=[];state.paging=null}
  if(meState.tab===kind)renderMePanel();
  try{
    if(kind==='history'){
      const offset=append?state.items.length:0;
      const response=await fetch(`/api/v1/me/history?limit=20&offset=${offset}`);
      if(!response.ok)throw new Error(await responseError(response));
      const data=await response.json();const items=Array.isArray(data.items)?data.items:[];
      state.items=append?state.items.concat(items):items;
      state.paging={isEnd:items.length<20,nextOffset:null,totals:null,incomplete:false};
    }else{
      // 服务端给出的 NextOffset 必须原样回传，不自行换算
      const offset=append&&state.paging?.nextOffset?state.paging.nextOffset:'0';
      const response=await fetch(`/api/v1/me/${kind}?limit=20&offset=${encodeURIComponent(offset)}`);
      if(!response.ok)throw new Error(await responseError(response));
      const data=await response.json();const items=Array.isArray(data.items)?data.items:[];
      state.items=append?state.items.concat(items):items;
      state.paging=data.paging||null;
    }
  }catch(error){state.error=error.message||t('historyFailed')}
  finally{state.loading=false;state.loaded=true;if(meState.tab===kind)renderMePanel()}
}

(function(){
  const canvas=document.querySelector('#bg');if(!canvas)return;
  const ctx=canvas.getContext('2d');const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const scheme=()=>document.documentElement.dataset.theme==='dark'?{colors:[[68,152,251],[107,173,252],[144,194,253]],alpha:.2,glow:[74,155,251]}:{colors:[[5,109,232],[65,150,251],[130,186,252]],alpha:1,glow:[5,109,232]};
  let palette=scheme();const mouse={x:-1e4,y:-1e4,active:false};
  new MutationObserver(()=>{palette=scheme()}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  let w=0,h=0,particles=[],raf=0,last=0,resizeTimer=0,burst=false,burstAt=0,visits=0;
  function textTargets(octx){
    const size=Math.min(w*.34,h*.5);
    octx.font=`900 ${size}px "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif`;
    octx.textAlign='center';octx.textBaseline='middle';octx.fillStyle='#000';octx.fillText('知乎',w/2,h*.47);
  }
  async function sampleTargets(octx){
    let fromLogo=false;
    try{
      const response=await fetch('/zhihu-logo.png');if(!response.ok)throw new Error('logo');
      const bitmap=await createImageBitmap(await response.blob());
      const logoW=Math.min(w*.78,h*1.9);const logoH=logoW*bitmap.height/bitmap.width;
      octx.drawImage(bitmap,w/2-logoW/2,h*.46-logoH*.34,logoW,logoH);fromLogo=true;
    }catch{ textTargets(octx) }
    const data=octx.getImageData(0,0,w,h).data;const step=Math.max(5,Math.round(Math.min(w,h)/150));const points=[];
    for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){const i=(y*w+x)*4;const r=data[i],b=data[i+2],a=data[i+3];if(fromLogo?(a>120&&b>r+40):a>140)points.push(x,y)}
    return points;
  }
  async function build(){
    w=canvas.clientWidth;h=canvas.clientHeight;
    const dpr=Math.min(devicePixelRatio||1,1.5);
    canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    const off=document.createElement('canvas');off.width=w;off.height=h;const octx=off.getContext('2d');
    const points=await sampleTargets(octx);const stride=Math.max(1,Math.ceil(points.length/2/3200));particles=[];
    for(let i=0;i<points.length;i+=stride*2){const hx=points[i],hy=points[i+1];
      // 开场：粒子从整屏随机位置与随机速度出发，再由弹簧收拢成"知乎"字形
      particles.push({hx:hx+(Math.random()-.5)*3,hy:hy+(Math.random()-.5)*3,x:reduced?hx:Math.random()*w,y:reduced?hy:Math.random()*h,vx:reduced?0:(Math.random()-.5)*1.5,vy:reduced?0:(Math.random()-.5)*1.5,s:2+Math.round(Math.random()*2),a:(.3+Math.random()*.42)*palette.alpha,c:palette.colors[(i>>1)%3]});}
    burstAt=performance.now();burst=!reduced;visits=0;
  }
  function draw(){
    ctx.clearRect(0,0,w,h);
    const burstNow=burst;visits++;
    if(burstNow){
      let settled=0;
      for(const p of particles){if(Math.hypot(p.hx-p.x,p.hy-p.y)<3)settled++;}
      if(settled/particles.length>.97||performance.now()-burstAt>3200)burst=false;
    }
    if(mouse.active&&!burstNow){const g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,240);g.addColorStop(0,`rgba(${palette.glow[0]},${palette.glow[1]},${palette.glow[2]},.12)`);g.addColorStop(1,`rgba(${palette.glow[0]},${palette.glow[1]},${palette.glow[2]},0)`);ctx.fillStyle=g;ctx.fillRect(mouse.x-240,mouse.y-240,480,480)}
    for(const p of particles){
      
      p.vx+=(p.hx-p.x)*.12+(Math.random()-.5)*.09;p.vy+=(p.hy-p.y)*.12+(Math.random()-.5)*.09;
      let near=0;
      if(mouse.active&&!burstNow){const dx=p.x-mouse.x,dy=p.y-mouse.y,d=Math.hypot(dx,dy);
        if(d<130){const k=1-d/130;near=k;const a=Math.random()*Math.PI*2;
          p.vx+=Math.cos(a)*1.8*k+dx/(d||1)*.6*k;p.vy+=Math.sin(a)*1.8*k+dy/(d||1)*.6*k}}
      p.vx*=.75;p.vy*=.75;p.x+=p.vx;p.y+=p.vy;
      const s=p.s;ctx.fillStyle=`rgba(${p.c[0]},${p.c[1]},${p.c[2]},${Math.min(1,p.a+near*.6)})`;ctx.fillRect(p.x-s/2,p.y-s/2,s,s);
    }
  }
  const frame=t=>{raf=requestAnimationFrame(frame);if(document.hidden)return;if(t-last<1000/30)return;last=t-(t-last)%(1000/30);draw()};
  if(!reduced&&!matchMedia('(hover: none)').matches){
    addEventListener('pointermove',event=>{mouse.x=event.clientX;mouse.y=event.clientY;mouse.active=true},{passive:true});
    document.addEventListener('mouseleave',()=>{mouse.active=false});addEventListener('blur',()=>{mouse.active=false});
  }
  addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{build().then(()=>{if(reduced)draw()})},160)},{passive:true});
  build().then(()=>{if(reduced)draw();else raf=requestAnimationFrame(frame)});
})();
</script>
