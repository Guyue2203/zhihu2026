<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>转变之前 · 认知时间线</title>
<style>
:root{--ink:#172033;--muted:#667085;--blue:#1769e0;--line:#d9e0ea;--paper:#f5f7fb;--card:#fff;--warm:#f4a261}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,system-ui,"Microsoft YaHei",sans-serif}main{width:min(1120px,calc(100% - 32px));margin:auto;padding:56px 0 90px}.modebar{display:flex;justify-content:flex-end;gap:8px}.modebar a{border:1px solid var(--line);border-radius:999px;padding:6px 11px;color:var(--muted);font-size:13px;text-decoration:none}.modebar a.active{color:#fff;background:var(--ink);border-color:var(--ink)}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--blue)}h1{font-size:clamp(40px,7vw,78px);line-height:1.05;letter-spacing:-.06em;margin:12px 0}.lead{max-width:720px;color:var(--muted);font-size:18px;line-height:1.7}.search{display:flex;gap:10px;margin:30px 0 14px;background:var(--card);padding:9px;border:1px solid var(--line);box-shadow:0 16px 45px #1720330d}.search input{min-width:0;flex:1;border:0;outline:0;font-size:17px;padding:14px}.search button{border:0;background:var(--blue);color:#fff;padding:0 25px;font-weight:800;cursor:pointer}.search button:disabled{opacity:.55}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;color:var(--muted);cursor:pointer}.status{min-height:28px;margin:24px 0;color:var(--blue);font-weight:700}.wait{padding:48px 0;text-align:center}.spinner{width:42px;height:42px;border:4px solid #dce8fb;border-top-color:var(--blue);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}.summary{background:var(--ink);color:#fff;padding:30px;border-radius:18px;margin-bottom:30px}.summary h2{font-size:32px;margin:0 0 10px}.summary p{color:#d7deeb;line-height:1.7;margin:7px 0}.timeline{position:relative;margin:10px 0 35px;padding-left:34px}.timeline:before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:#cbd6e6}.stage{position:relative;margin:0 0 28px}.stage:before{content:"";position:absolute;left:-31px;top:7px;width:14px;height:14px;background:var(--warm);border:4px solid var(--paper);outline:2px solid var(--blue);border-radius:50%}.stage-head{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.stage h3{margin:0;font-size:23px}.period{color:var(--blue);font-weight:800}.stage p{line-height:1.7;margin:8px 0;color:#475467}.stage .query{font-size:13px;color:#98a2b3}.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:15px}.post{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 8px 20px #17203308}.post h4{margin:0 0 9px;font-size:17px;line-height:1.45}.meta{color:var(--muted);font-size:13px}.viewpoint{font-size:15px;line-height:1.65;margin:12px 0;color:#344054}.post a{color:var(--blue);font-weight:800;text-decoration:none}.limits{border-top:1px solid var(--line);padding-top:20px;color:var(--muted);line-height:1.7;font-size:14px}@media(max-width:700px){main{padding-top:32px}.search{display:block}.search input{width:100%}.search button{width:100%;height:48px;margin-top:8px}.posts{grid-template-columns:1fr}}
</style></head>
<body><main>
<nav class="modebar" aria-label="运行模式"><a data-mode="fixture" href="?mode=fixture">Fixture 联调</a><a data-mode="live" href="?mode=live">Live 真实</a></nav><div class="eyebrow">MUSEUM OF CHANGING MINDS</div><h1>转变之前</h1><p class="lead">先让 AI 梳理一个问题的认知时间线，再从每个阶段寻找能代表当时观点的知乎帖子。</p>
<form class="search" id="search"><input id="query" maxlength="100" required placeholder="例如：共享单车为什么失败？"><button>开始梳理</button></form>
<div class="chips"><button type="button" data-query="共享单车为什么失败？">共享单车</button><button type="button" data-query="元宇宙热潮为什么退去？">元宇宙</button><button type="button" data-query="3D电视为什么没有成为主流？">3D电视</button></div>
<p class="status" id="status" role="status" aria-live="polite"></p><section id="result" hidden></section>
</main>
<script>
const form=document.querySelector('#search'),input=document.querySelector('#query'),status=document.querySelector('#status'),result=document.querySelector('#result');
const requestedMode=new URLSearchParams(location.search).get('mode');
const mode=['fixture','live'].includes(requestedMode)?requestedMode:null;
document.querySelectorAll('[data-mode]').forEach(link=>link.classList.toggle('active',link.dataset.mode===mode));
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const el=(tag,text='',className='')=>{const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;return node};
function postCard(post){const card=el('article','', 'post');card.append(el('h4',post.question||'知乎问题'),el('div',`答主：${post.answerer||'知乎用户'}　热度参考 ${post.heat||0}　${post.votes||0} 赞同 · ${post.comments||0} 评论`,'meta'),el('p',post.viewpoint||post.excerpt||'暂无观点简介','viewpoint'));if(post.url&&post.url!=='#'){const link=document.createElement('a');link.href=post.url;link.target='_blank';link.rel='noopener noreferrer';link.textContent='查看知乎原帖 →';card.append(link)}return card}
function render(data){result.replaceChildren();const summary=el('section','', 'summary');summary.append(el('h2',data.title||data.query),el('p',data.thesis||data.intro||''));result.append(summary);const posts=new Map((data.posts||[]).map(post=>[post.id,post]));const timeline=el('section','', 'timeline');for(const stage of data.stages||[]){const block=el('article','', 'stage');const head=el('div','', 'stage-head');head.append(el('span',stage.period||'时间不明','period'),el('h3',stage.cognition||'阶段认知'));block.append(head,el('p',stage.change||'变化不明'),el('p',stage.evidence||''));if(stage.crawlerQuery)block.append(el('p',`阶段检索词：${stage.crawlerQuery} · 爬虫状态：${stage.crawlerStatus||'unknown'} · 候选 ${stage.crawlHitCount||0} 条`,'query'));const grid=el('div','', 'posts');for(const id of stage.postIds||[]){if(posts.has(id))grid.append(postCard(posts.get(id)))}if(grid.childElementCount)block.append(grid);timeline.append(block)}result.append(timeline);const limits=el('div','', 'limits');limits.append(el('strong',`已检索 ${data.evidenceCount||0} 条，展示 ${data.selectedCount||0} 条`));for(const item of data.limitations||[])limits.append(el('div',`· ${item}`));result.append(limits);result.hidden=false}
async function submit(event){event.preventDefault();const query=input.value.trim();if(query.length<2)return;const button=form.querySelector('button');button.disabled=true;result.hidden=true;status.innerHTML='';const waiting=el('div','', 'wait');waiting.append(el('div','','spinner'),el('strong','正在梳理问题并寻找各阶段代表性帖子…'),el('p','预计需要 8–10 秒，请勿关闭页面。'));result.replaceChildren(waiting);result.hidden=false;try{const suffix=mode?`?mode=${encodeURIComponent(mode)}`:'';const request=fetch(`/api/v1/journey${suffix}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})}).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'生成失败');return data});const [data]=await Promise.all([request,wait(8500)]);render(data);status.textContent=data.coverage==='fixture'?'当前为 Fixture 联调模式':'当前为 Live 真实模式'}catch(error){result.hidden=true;status.textContent=error.message||'生成失败'}finally{button.disabled=false}}
form.addEventListener('submit',submit);document.querySelectorAll('[data-query]').forEach(button=>button.addEventListener('click',()=>{input.value=button.dataset.query;form.requestSubmit()}));
</script></body></html>
