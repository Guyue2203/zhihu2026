<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="把一个后来有了答案的问题放回时间中，看见观点与证据如何改变。">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f6ef7'/%3E%3Cpath d='M8 10h16M8 16h10M8 22h16' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='21.5' cy='16' r='2.5' fill='white'/%3E%3C/svg%3E">
<title>转变之前</title>
<style>
:root{color-scheme:light;--bg:#f7f9fd;--surface:rgba(255,255,255,.72);--surface-solid:#fff;--ink:#172033;--muted:#6c7690;--soft:#9ba5ba;--line:rgba(52,75,124,.13);--blue:#4f6ef7;--blue-dark:#3d58d8;--blue-pale:#edf2ff;--shadow:0 24px 70px rgba(54,76,133,.11);--sans:Inter,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;overflow-x:hidden}button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{color:inherit}a{color:inherit}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 18% 18%,rgba(127,159,255,.18),transparent 28%),radial-gradient(circle at 82% 35%,rgba(180,216,255,.22),transparent 32%),linear-gradient(180deg,#f9fbff 0%,#f3f6fc 58%,#fff 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;opacity:.42;background-image:linear-gradient(rgba(80,106,159,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(80,106,159,.055) 1px,transparent 1px);background-size:72px 72px;mask-image:linear-gradient(to bottom,#000,transparent 78%)}
.topbar{position:fixed;left:0;right:0;top:0;z-index:20;height:72px;padding:0 max(24px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;background:rgba(248,250,254,.7);backdrop-filter:blur(18px);border-bottom:1px solid transparent;transition:border-color .2s,background .2s}.topbar.scrolled{border-color:var(--line);background:rgba(248,250,254,.9)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:720;letter-spacing:-.02em}.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--blue);color:#fff;font-size:14px;box-shadow:0 8px 22px rgba(79,110,247,.24)}
.top-actions{display:flex;align-items:center;gap:20px}.example-link{color:var(--muted);font-size:14px;text-decoration:none}.example-link:hover{color:var(--blue)}.modebar{display:flex;gap:4px;padding:3px;background:rgba(255,255,255,.58);border:1px solid var(--line);border-radius:999px}.modebar[hidden]{display:none}.modebar a{padding:4px 10px;border-radius:999px;color:var(--soft);font-size:12px;text-decoration:none}.modebar a.active{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(43,61,103,.08)}
.home{min-height:100vh;width:min(880px,calc(100% - 36px));margin:auto;display:grid;align-content:center;justify-items:center;text-align:center;padding:108px 0 84px;transition:opacity .25s,transform .25s}.home[hidden]{display:none}
.announcement{display:inline-flex;align-items:center;gap:8px;margin-bottom:28px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.46);color:var(--muted);font-size:13px}.announcement i{width:6px;height:6px;border-radius:50%;background:var(--blue)}
h1,h2,h3,h4,p{margin-top:0}.home h1{font-size:clamp(46px,7vw,72px);line-height:1.1;letter-spacing:.08em;font-weight:590;margin:0 0 18px}.lead{margin:0 0 38px;color:var(--muted);font-size:18px;line-height:1.8}
.search-shell{width:min(760px,100%);padding:8px;border:1px solid rgba(86,111,168,.18);border-radius:25px;background:rgba(255,255,255,.68);box-shadow:var(--shadow);backdrop-filter:blur(18px);transition:border-color .2s,box-shadow .2s}.search-shell:focus-within{border-color:rgba(79,110,247,.48);box-shadow:0 28px 80px rgba(54,76,133,.15)}.search{display:grid;grid-template-columns:1fr auto;align-items:end;min-height:126px}.search textarea{width:100%;min-height:112px;resize:none;border:0;background:transparent;outline:0;padding:18px 18px 44px;color:var(--ink);font:inherit;font-size:17px;line-height:1.65}.search textarea::placeholder{color:#8d97ad}.submit{width:44px;height:44px;margin:0 4px 4px 0;border:0;border-radius:50%;background:var(--blue);color:#fff;font-size:22px;cursor:pointer;box-shadow:0 10px 24px rgba(79,110,247,.28);transition:transform .2s,background .2s}.submit:hover{background:var(--blue-dark);transform:translateY(-2px)}.submit:disabled{opacity:.5;cursor:wait;transform:none}
.suggestions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.suggestions button{border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.42);padding:7px 13px;color:var(--muted);font-size:13px;cursor:pointer}.suggestions button:hover{background:#fff;color:var(--blue)}
.home-note{margin-top:34px;color:var(--soft);font-size:12px}.result-area{width:min(1020px,calc(100% - 36px));margin:0 auto;padding:118px 0 90px}.result-area[hidden]{display:none}.result-top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:46px}.back-button{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--muted);padding:0;cursor:pointer;font-size:14px}.back-button:hover{color:var(--blue)}.coverage{color:var(--soft);font-size:12px}
.result-heading{text-align:center;max-width:820px;margin:0 auto 52px}.result-heading h2{font-size:clamp(34px,5.4vw,58px);line-height:1.25;letter-spacing:-.05em;margin-bottom:16px}.result-heading p{max-width:680px;margin:auto;color:var(--muted);font-size:17px}
.stage-tabs{display:flex;align-items:flex-start;justify-content:center;max-width:850px;margin:0 auto 50px;padding:0 20px;overflow-x:auto;scrollbar-width:none}.stage-tabs::-webkit-scrollbar{display:none}.stage-tab{position:relative;min-width:150px;border:0;background:transparent;color:var(--soft);padding:28px 12px 0;cursor:pointer;text-align:center;font-size:13px}.stage-tab::before{content:"";position:absolute;left:0;right:0;top:8px;height:1px;background:var(--line)}.stage-tab:first-child::before{left:50%}.stage-tab:last-child::before{right:50%}.stage-tab::after{content:"";position:absolute;left:50%;top:3px;width:11px;height:11px;border:2px solid #d5dcea;border-radius:50%;background:var(--bg);transform:translateX(-50%);transition:.2s}.stage-tab.active{color:var(--ink);font-weight:650}.stage-tab.active::after{border-color:var(--blue);background:var(--blue);box-shadow:0 0 0 6px rgba(79,110,247,.11)}
.stage-card{max-width:820px;margin:auto;padding:42px 48px;border:1px solid rgba(77,103,161,.15);border-radius:26px;background:rgba(255,255,255,.72);box-shadow:0 28px 80px rgba(53,74,125,.09);backdrop-filter:blur(18px);animation:stage-in .36s ease both}@keyframes stage-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.stage-period{color:var(--blue);font-size:13px;font-weight:700;margin-bottom:13px}.stage-card h3{font-size:clamp(25px,3.5vw,36px);line-height:1.4;letter-spacing:-.035em;margin-bottom:34px}.insight-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}.insight{padding-top:18px;border-top:1px solid var(--line)}.insight strong{display:block;margin-bottom:9px;font-size:14px}.insight p{margin:0;color:var(--muted);font-size:15px}.source-list{margin-top:38px}.source-list>strong{display:block;margin-bottom:6px;font-size:14px}.source{display:grid;grid-template-columns:28px 1fr auto;gap:10px;padding:18px 0;border-bottom:1px solid var(--line)}.source-index{color:var(--blue);font-size:12px;padding-top:3px}.source h4{font-size:16px;line-height:1.55;margin-bottom:5px}.source p{color:var(--muted);font-size:14px;margin-bottom:5px}.source small{color:var(--soft);font-size:12px}.source a{align-self:center;color:var(--blue);font-size:13px;text-decoration:none}.stage-actions{display:flex;justify-content:space-between;align-items:center;margin-top:34px}.stage-actions button{border:0;background:transparent;color:var(--muted);padding:8px 0;cursor:pointer}.stage-actions button:hover{color:var(--blue)}.stage-actions button.primary{color:var(--blue);font-weight:650}.stage-actions button:disabled{visibility:hidden}.details{max-width:820px;margin:24px auto 0;color:var(--muted);font-size:13px}.details summary{cursor:pointer;color:var(--soft);list-style:none;text-align:center}.details summary::-webkit-details-marker{display:none}.details summary::after{content:" ＋"}.details[open] summary::after{content:" －"}.details-body{margin-top:14px;padding:18px 22px;border-radius:16px;background:rgba(255,255,255,.48);line-height:1.8}.query-record{color:var(--soft);margin-top:8px}
.wait{min-height:calc(100vh - 72px);display:grid;place-items:center;text-align:center;padding:100px 24px}.wait-inner{max-width:570px}.wait-mark{width:52px;height:52px;margin:0 auto 28px;border-radius:17px;background:linear-gradient(135deg,#6f8bff,#bdccff);box-shadow:0 20px 50px rgba(79,110,247,.25);animation:float 2.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) rotate(5deg)}}.wait strong{display:block;font-size:24px;margin-bottom:12px}.wait p{color:var(--muted);margin:0;font-size:16px}
.error{max-width:620px;margin:160px auto 0;text-align:center}.error strong{display:block;font-size:22px;margin-bottom:8px}.error p{color:var(--muted)}
@media(max-width:720px){.topbar{height:62px;padding:0 16px}.example-link{display:none}.modebar a{padding:3px 8px}.home{width:calc(100% - 28px);padding:88px 0 54px}.announcement{margin-bottom:20px}.home h1{font-size:43px;letter-spacing:.05em}.lead{font-size:16px;margin-bottom:28px}.search-shell{border-radius:21px}.search{min-height:116px}.search textarea{min-height:102px;padding:16px 14px 42px}.result-area{width:calc(100% - 28px);padding:88px 0 60px}.result-top{margin-bottom:35px}.result-heading{margin-bottom:38px}.result-heading h2{font-size:34px}.stage-tabs{justify-content:flex-start;margin-bottom:28px;padding:0}.stage-tab{min-width:112px}.stage-card{padding:30px 22px;border-radius:22px}.insight-grid{grid-template-columns:1fr;gap:24px}.source{grid-template-columns:24px 1fr}.source a{grid-column:2}.stage-actions{margin-top:24px}.coverage{display:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}.wait-mark,.stage-card{animation:none!important}}
</style>
</head>
<body>
<header class="topbar" id="topbar"><a class="brand" href="/"><span class="brand-mark">转</span><span>转变之前</span></a><div class="top-actions"><a class="example-link" href="/curation.html#bike">体验精选示例</a><nav class="modebar" aria-label="数据模式"><a data-mode="fixture" href="?mode=fixture">样本</a><a data-mode="live" href="?mode=live">在线</a></nav></div></header>

<main class="home" id="home">
  <div class="announcement"><i></i><span>从结论回到它尚未确定的时候</span></div>
  <h1>转变之前</h1>
  <p class="lead">看见一个答案，是怎样慢慢形成的</p>
  <div class="search-shell">
    <form class="search" id="search"><textarea id="query" maxlength="100" required rows="3" aria-label="输入问题" placeholder="输入一个后来有了答案的问题…"></textarea><button class="submit" aria-label="开始生成">↑</button></form>
  </div>
  <div class="suggestions" aria-label="示例问题"><button type="button" data-query="共享单车为什么失败？">共享单车</button><button type="button" data-query="元宇宙热潮为什么退去？">元宇宙</button><button type="button" data-query="3D电视为什么没有成为主流？">3D 电视</button></div>
  <div class="home-note">结果来自有限检索样本，每条判断都可回到知乎原文核查</div>
</main>

<main class="result-area" id="result" hidden></main>

<script>
const form=document.querySelector('#search');
const input=document.querySelector('#query');
const home=document.querySelector('#home');
const result=document.querySelector('#result');
const topbar=document.querySelector('#topbar');
const requestedMode=new URLSearchParams(location.search).get('mode');
const mode=['fixture','live'].includes(requestedMode)?requestedMode:null;
if(!mode)document.querySelector('.modebar').hidden=true;
document.querySelectorAll('[data-mode]').forEach(link=>link.classList.toggle('active',link.dataset.mode===mode));
addEventListener('scroll',()=>topbar.classList.toggle('scrolled',scrollY>12),{passive:true});
const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const el=(tag,text='',className='')=>{const node=document.createElement(tag);node.textContent=text;if(className)node.className=className;return node};
let currentJourney=null;
let currentStage=0;

function sourceItem(post,index){const row=el('article','', 'source');row.append(el('span',String(index+1).padStart(2,'0'),'source-index'));const copy=el('div');copy.append(el('h4',post.question||'知乎问题'),el('p',post.viewpoint||post.excerpt||'暂无观点简介'),el('small',`${post.answerer||'知乎用户'} · ${post.votes||0} 赞同 · ${post.comments||0} 评论`));row.append(copy);if(post.url&&post.url!=='#'){const link=el('a','查看原帖 ↗');link.href=post.url;link.target='_blank';link.rel='noopener noreferrer';row.append(link)}return row}

function showStage(index){
  if(!currentJourney)return;
  currentStage=Math.min(Math.max(index,0),currentJourney.stages.length-1);
  const stage=currentJourney.stages[currentStage];
  const posts=new Map((currentJourney.posts||[]).map(post=>[post.id,post]));
  document.querySelectorAll('.stage-tab').forEach((button,i)=>{button.classList.toggle('active',i===currentStage);button.setAttribute('aria-current',i===currentStage?'step':'false')});
  const previous=document.querySelector('.stage-card');if(previous)previous.remove();
  const card=el('section','', 'stage-card');
  card.append(el('div',stage.period||'时间不明','stage-period'),el('h3',stage.cognition||'阶段认知'));
  const insights=el('div','', 'insight-grid');const change=el('div','', 'insight');change.append(el('strong','判断如何改变'),el('p',stage.change||'变化不明'));const evidence=el('div','', 'insight');evidence.append(el('strong','改变判断的证据'),el('p',stage.evidence||'证据不足'));insights.append(change,evidence);card.append(insights);
  const selected=(stage.postIds||[]).map(id=>posts.get(id)).filter(Boolean);if(selected.length){const list=el('section','', 'source-list');list.append(el('strong','相关知乎讨论'));selected.forEach((post,i)=>list.append(sourceItem(post,i)));card.append(list)}
  const actions=el('div','', 'stage-actions');const prev=el('button','← 上一阶段');prev.disabled=currentStage===0;prev.addEventListener('click',()=>showStage(currentStage-1));const next=el('button',currentStage===currentJourney.stages.length-1?'回到开头':'下一阶段 →','primary');next.addEventListener('click',()=>showStage(currentStage===currentJourney.stages.length-1?0:currentStage+1));actions.append(prev,next);card.append(actions);
  const details=document.querySelector('.details');result.insertBefore(card,details);card.scrollIntoView({behavior:'smooth',block:'center'});
}

function render(data){
  currentJourney=data;currentStage=0;result.replaceChildren();
  const top=el('div','', 'result-top');const back=el('button','← 提出新问题','back-button');back.addEventListener('click',reset);top.append(back,el('span',data.coverage==='fixture'?'当前展示样本数据':'有限检索结果','coverage'));result.append(top);
  const heading=el('header','', 'result-heading');heading.append(el('h2',data.title||data.query),el('p',data.thesis||''));result.append(heading);
  const tabs=el('nav','', 'stage-tabs');tabs.setAttribute('aria-label','认知阶段');(data.stages||[]).forEach((stage,index)=>{const button=el('button',stage.period||`阶段 ${index+1}`,'stage-tab');button.addEventListener('click',()=>showStage(index));tabs.append(button)});result.append(tabs);
  const details=document.createElement('details');details.className='details';const summary=document.createElement('summary');summary.textContent='关于本次结果';const body=el('div','', 'details-body');for(const item of data.limitations||[])body.append(el('div',`· ${item}`));body.append(el('div',`共检索 ${data.evidenceCount||0} 条材料，展示 ${data.selectedCount||0} 条。`));details.append(summary,body);result.append(details);
  result.hidden=false;showStage(0);scrollTo({top:0,behavior:'smooth'});
}

function reset(){currentJourney=null;result.hidden=true;result.replaceChildren();home.hidden=false;input.value='';input.focus();scrollTo({top:0,behavior:'smooth'})}

function showError(message){result.replaceChildren();const box=el('div','', 'error');box.append(el('strong','这次没有顺利生成'),el('p',message||'请稍后再试。'));const back=el('button','返回重新提问','back-button');back.addEventListener('click',reset);box.append(back);result.append(box);result.hidden=false}

async function submit(event){
  event.preventDefault();const query=input.value.trim();if(query.length<2)return;const button=form.querySelector('button');button.disabled=true;home.hidden=true;result.hidden=false;const waiting=el('section','', 'wait');const inner=el('div','', 'wait-inner');const progress=el('p','正在把问题放回时间中…');inner.append(el('div','','wait-mark'),el('strong','寻找答案改变的时刻'),progress);waiting.append(inner);result.replaceChildren(waiting);let settled=false;let preludeShown=false;const startedAt=Date.now();const timer=setInterval(()=>{if(!preludeShown)progress.textContent=`已进行 ${Math.round((Date.now()-startedAt)/1000)} 秒，正在核对不同阶段的讨论。`},3000);
  try{const suffix=mode?`?mode=${encodeURIComponent(mode)}`:'';const preludeFetch=fetch(`/api/v1/prelude${suffix}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})}).then(async response=>response.ok?await response.json():null).catch(()=>null);preludeFetch.then(data=>{if(!settled&&data?.prelude){preludeShown=true;progress.textContent=data.prelude}});const request=fetch(`/api/v1/journey${suffix}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})}).then(async response=>{const data=await response.json();if(!response.ok)throw new Error(data.error||'生成失败');return data});const [data]=await Promise.all([request,wait(700)]);settled=true;render(data)}catch(error){settled=true;showError(error.message)}finally{clearInterval(timer);button.disabled=false}
}

form.addEventListener('submit',submit);
document.querySelectorAll('[data-query]').forEach(button=>button.addEventListener('click',()=>{input.value=button.dataset.query;form.requestSubmit()}));
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});
</script>
</body>
</html>
